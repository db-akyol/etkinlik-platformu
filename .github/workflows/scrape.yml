name: Scrape events

# Runs the scraper framework (scripts/scrapers/run-all.ts) twice a day.
# See docs/plan.md's scraping ethics note: this cadence is deliberately low
# (2x/day, not hourly) to avoid hammering source sites.
#
# Scraped events are published immediately (`status: "approved"`) — the
# approval queue was removed once every active source turned out to be an
# official ticket vendor or the municipality itself, where there's no
# realistic reason to reject a listing. Re-scraping an event an admin DID
# reject by hand leaves its status alone rather than resurrecting it. See
# scripts/scrapers/lib/upsert-event.ts (and its tests) for both rules.

on:
  schedule:
    # 06:00 and 18:00 UTC daily.
    - cron: "0 6,18 * * *"
  workflow_dispatch: {} # allow manual triggering from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run scrapers
        run: npx tsx scripts/scrapers/run-all.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
